[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "priconne-cb-yt-collector"
version = "0.1.0"
description = "プリコネ クラバト期間中の YouTube 攻略動画を自動収集し Discord に投稿する Bot"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "discord.py>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
priconne-cb-collector = "priconne_cb_collector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/priconne_cb_collector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # discord.py のデコレータパターンで既定値に関数呼び出しを使うため
]

[tool.ruff.lint.isort]
known-first-party = ["priconne_cb_collector"]
