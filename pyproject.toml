[project]
name = "priconne-cb-yt-collector"
version = "0.1.0"
description = "プリコネ クラバト期間中の YouTube 攻略動画を自動収集し Discord に投稿する Bot"
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.3",
    "httpx>=0.27",
    "feedparser>=6.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
